name: sync-data

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run fetch-data
      - id: changes
        run: |
          if git diff --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'false'
        run: echo "no upstream data changes; exiting"
      - if: steps.changes.outputs.changed == 'true'
        run: npm test
      - if: steps.changes.outputs.changed == 'true'
        name: Bump patch, commit, tag
        id: bump
        run: |
          data_version=$(node -e "console.log(require('./data/version.json').version)")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m "chore(data): sync cloudip-db ${data_version}"
          new_version=$(npm version patch -m "chore(release): %s (cloudip-db ${data_version})")
          git push origin HEAD --tags
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.changed == 'true'
        run: npm run build
      - if: steps.changes.outputs.changed == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
